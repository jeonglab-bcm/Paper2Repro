name: Review site tests

on:
  pull_request:
    paths:
      - "review-site/**"
      - ".github/workflows/review-site-tests.yml"
  push:
    branches: [main]
    paths:
      - "review-site/**"
      - ".github/workflows/review-site-tests.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The rules of the page (links, values, table shape, file sorting, escaping)
        run: node --test review-site/tests/core.test.mjs

      - name: Install the AI judge's packages
        working-directory: review-site/judge
        run: npm ci

      - name: The AI judge, with stand-ins for Claude and GitHub
        run: node --test review-site/judge/judge.test.mjs
