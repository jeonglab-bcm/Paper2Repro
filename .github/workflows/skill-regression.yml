name: Skill regression (PMC4081639)

# End-to-end check that the current skill can still reproduce a known paper.
# An unattended Claude Code run uses the skill from this commit, with the worked
# example for this paper withheld, to reproduce Fig. 2 and Table 1 of Yu & Shaw (2014).
# score.py then checks the results against the known answers.
#
# It costs API credits, so it runs only on manual dispatch, weekly, or on pull
# requests that carry the "skill-regression" label.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Claude model
        default: claude-opus-5-5
      max_budget_usd:
        description: Maximum API spend for the agent run (USD)
        default: "40"
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "skills/**"
      - "tests/skill-regression/**"
      - ".github/workflows/skill-regression.yml"

permissions:
  contents: read

concurrency:
  group: skill-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CASE: pmc4081639

jobs:
  reproduce:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'skill-regression')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      BUDGET: ${{ inputs.max_budget_usd || '40' }}
    steps:
      - name: Set paths
        run: |
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          echo "PROJECT=$RUNNER_TEMP/work/project" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"

      - name: Check the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository secret ANTHROPIC_API_KEY is not set."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install the blinded skill and move the harness out of the workspace
        run: |
          mkdir -p "$OUT" "$PROJECT" ~/.claude/skills
          cp -R tests/skill-regression "$HARNESS"
          source=$(python3 skills/paper2agent/scripts/skill_checksum.py)
          python3 tests/skill-regression/blind_skill.py skills/paper2agent ~/.claude/skills/paper2agent \
            "$HARNESS/$CASE/expected.json"
          # Record the skill version before the agent runs: the commit, the checksum of the
          # checkout and the checksum of the blinded copy that the agent reads.
          installed=$(python3 ~/.claude/skills/paper2agent/scripts/skill_checksum.py)
          printf '{"commit": "%s", "source": %s, "installed": %s}\n' \
            "$(git rev-parse HEAD)" "$source" "$installed" > "$OUT/skill-version.json"
          cat "$OUT/skill-version.json"
          # The checkout contains the unredacted worked example. Remove it so the agent cannot read it.
          cd "$RUNNER_TEMP"
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete

      - name: Check that the paper and data are reachable
        run: |
          for url in $(python3 -c "import json;print(' '.join(json.load(open('$HARNESS/$CASE/expected.json'))['inputs'].values()))"); do
            code=$(curl -sL -A "Mozilla/5.0" -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Input not reachable: $url (HTTP $code). This is an infrastructure failure, not a skill regression."
              exit 1
            fi
          done

      # The toolchain the paper's figures need (see paper2repro/references/publishing.md).
      - name: Install LaTeX and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-pictures preview-latex-style poppler-utils

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the skill unattended
        id: agent
        continue-on-error: true
        timeout-minutes: 200
        working-directory: ${{ runner.temp }}/work
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sed "s|{{PROJECT_DIR}}|$PROJECT|g" "$HARNESS/$CASE/prompt.md" > "$OUT/prompt.md"
          claude -p "$(cat "$OUT/prompt.md")" \
            --model "$MODEL" \
            --max-budget-usd "$BUDGET" \
            --dangerously-skip-permissions \
            --settings "$HARNESS/$CASE/settings.json" \
            --output-format stream-json --verbose \
            > "$OUT/transcript.jsonl"

      - name: Fetch the reference Fig. 2 series
        if: always()
        run: |
          url=$(python3 -c "import json;print(json.load(open('$HARNESS/$CASE/expected.json'))['fig2']['reference_csv_url'])")
          curl -fsSL -o "$OUT/fig2_reference.csv" "$url" || echo "::warning::Reference series not available"

      - name: Score the run
        if: always()
        run: |
          python3 "$HARNESS/score.py" --case "$HARNESS/$CASE" --project "$PROJECT" \
            --transcript "$OUT/transcript.jsonl" --fig2-reference "$OUT/fig2_reference.csv" \
            --skill-version "$OUT/skill-version.json" \
            --report "$OUT/report.md" --json "$OUT/score.json"

      - name: Build the session log (conversation, tool calls, tokens and cost)
        if: always()
        run: |
          python3 "$HARNESS/session_log.py" render "$OUT/transcript.jsonl" --out "$OUT/session" --prompt "$OUT/prompt.md"

      - name: Write the report to the job summary
        if: always()
        run: |
          cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No report." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "$OUT/session/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No session log." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full timeline: open \`out/session/session.html\` in the run artifact." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.agent.outcome }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The agent step ended with: ${{ steps.agent.outcome }} (time limit, budget limit or error)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-regression-${{ env.CASE }}
          path: |
            ${{ runner.temp }}/out
            ${{ runner.temp }}/work/project
          include-hidden-files: true
