[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Name the distribution and the import package after the method, not the paper ID.
name = "example-method"
version = "0.1.0"
description = "Doubling time from OD600 growth curves (Paper2Repro package template)."
readme = "README.md"
# Implemented from the paper's text: the repository's licence. Ported from the authors' code: that code's licence.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "<maintainer>" }]
# Compatible ranges with the tested versions as floors, for example "numpy>=2.1,<3".
# Exact pins belong in the reproduction pipeline's requirements.txt, not here.
dependencies = []

[project.scripts]
example-method = "example_method.cli:main"

# [project.urls]
# Reproduction = "https://github.com/<owner>/<repo>/tree/main/<paper-id>"
# Tutorial = "https://github.com/<owner>/<repo>/blob/main/<paper-id>/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/example_method"]
